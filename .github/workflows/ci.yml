name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://payload:payload@localhost:5432/payload
      PAYLOAD_SECRET: ci-secret-not-for-production
      PAYLOAD_API_KEY: ci-worker-key
      PUBLIC_SITE_URL: http://localhost:3000
      AI_GATEWAY_API_KEY: ''
      RESEND_API_KEY: ''

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # No `version:` — pnpm/action-setup reads it from package.json "packageManager"
      # (specifying both raises ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # apps/worker's tsconfig references the built @hht/shared, so its .d.ts
      # must exist before `pnpm typecheck` / `pnpm test`.
      - name: Build @hht/shared
        run: pnpm --filter @hht/shared build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build worker
        run: pnpm --filter @hht/worker build

      - name: Build web
        run: pnpm --filter @hht/web build

      - name: Jest
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @hht/web exec playwright install --with-deps chromium

      # Create the Payload tables in the CI Postgres so the e2e server's API
      # routes return 200 (empty) instead of 500. Seed-dependent specs then
      # skip themselves cleanly.
      - name: Push DB schema
        run: pnpm --filter @hht/web ensure-schema

      - name: Playwright
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
